# Эталонное RSA-объявление и sitelinks для генерации новых тематических групп
# (см. Клиенты/Юристы США/Решения.md, запись 2026-08-18 про gads_ad_adapter.py).
#
# Источник: аккаунт Andverpersonalinjury (customer_id 213-621-6123), кампания
# "search / car accident / ca - google search only", группа "Car Injury",
# AdId 820024267355 (ENABLED — второе объявление той же группы, AdId
# 812830723434, было на паузе на момент снятия эталона и не учтено).
# Снято: 2026-08-18.
#
# Правило адаптации под новую тему (см. gads_ad_adapter.py):
#   - headlines с role "themed" — текст заменяется по ad_phrase темы из
#     Словарь-тем.yaml (плейсхолдер {ad_phrase} в тексте ниже).
#   - headlines/descriptions с role "universal" — копируются без изменений
#     в любую новую группу.
#   - "themed" помечены осознанно после разбора с пользователем: то, что
#     явно завязано на "car accident" в тексте эталона, помечено themed;
#     общие блоки про гарантии/бесплатность/24-7 — universal.

final_url: https://landverpersonalinjury.com/

headlines:
  - text: "Injured in a {ad_phrase}?"
    pin: H1
    role: themed
  - text: "Top {ad_phrase_title} Attorney in CA"
    pin: H1
    role: themed
  - text: "CA {ad_phrase_title} Lawyers"
    pin: H1
    role: themed
  - text: "Top-Rated California Attorneys"
    pin: H2
    role: universal
  - text: "Ex-Insurance Defense Lawyers"
    pin: H2
    role: universal
  - text: "We Fight For Max Compensation"
    pin: H2
    role: universal
  - text: "Millions Secured For Victims"
    pin: H2
    role: universal
  - text: "We Know How Insurers Think"
    pin: H2
    role: universal
  - text: "No Fee Unless We Win"
    pin: H3
    role: universal
  - text: "We Cover All Case Costs"
    pin: H3
    role: universal
  - text: "100% Free Consultation 24/7"
    pin: H3
    role: universal
  - text: "Direct Access To Your Lawyer"
    pin: H3
    role: universal
  - text: "Speak To An Attorney Now"
    pin: H3
    role: universal
  - text: "{{KeyWord:{ad_phrase_title} Lawyer CA}}"
    pin: H1
    role: themed
  - text: "Injured In {{LOCATION(City):California}}?"
    pin: H1
    role: universal  # динамическая вставка локации — не завязана на тему

descriptions:
  - text: "Injured in a CA {ad_phrase}? We cover all case costs. No fee unless we win. Call 24/7"
    pin: D1
    role: themed
  - text: "Former insurance defense attorneys on your side. We know how they think & how to win."
    pin: D2
    role: universal
  - text: "Securing millions for accident victims statewide. Get the max settlement you deserve."
    pin: D2
    role: universal
  - text: "45 years injury law experience. $38.5M+ verdicts. 100% Free injury consultation."
    pin: D2
    role: universal


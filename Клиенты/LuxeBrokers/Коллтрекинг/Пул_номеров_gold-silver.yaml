      - "+12133296035"
      - "+12133296024"
      - "+12133295137"
      - "+12133295019"
      - "+12133295047"

# ignore_numbers НЕ задавать: реальный номер +12137947666 на кнопках «Call now» — это и есть ошибка, которую ловит проверка.

# Пул ПОЛНЫЙ НЕ ИЗВЕСТЕН (скриншота кабинета нет): здесь номера, реально выданные в прогонах 2026-10-19
# (329-60-35, 329-51-37, 329-50-19) и ранее виденный мобильный (329-50-47, План_наращивания_объёма_2026-10.md).

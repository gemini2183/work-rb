# Запуск: python phone_swap_check.py --client-folder "LuxeBrokers" --pool-file "Коллтрекинг/Пул_номеров_gold-silver.yaml"

url: "https://jewelryfastsale.com/gold-silver"

# Статический номер сайта (без UTM) — на нём же кнопки «Call now» и WhatsApp

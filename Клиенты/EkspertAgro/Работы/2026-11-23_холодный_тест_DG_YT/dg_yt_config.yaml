    - "Płatność przy odbiorze"
    - "Sprawdzasz, potem płacisz"
    - "Producent szklarni od 2008"
    - "Dostawa w 3–7 dni"
    - "Prezenty o wartości 249 zł"
  long_headlines:
    - "Szklarnia z poliwęglanu od producenta. Płacisz dopiero po odbiorze, bez przedpłat"
    - "Tylko dziś: prezenty o wartości 249 zł do każdej szklarni. Dostawa w całej Polsce"
  descriptions:
    - "Płacisz po odbiorze, bez przedpłat. Paczka u Ciebie w 3–7 dni, dostawa w całej Polsce."
    - "Poliwęglan 6 mm z ochroną UV i ocynkowany profil 40×20 mm. Żywotność ponad 15 lat."

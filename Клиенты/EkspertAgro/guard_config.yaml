# Универсальный сторож расхода и цены заявки: Скрипты/gads_spend_guard_cpa.py --client EkspertAgro
# Файл описывает ЧТО охранять. Боевой режим (--execute) задаётся только флагом запуска, не здесь.
# СТАТУС: черновик 2026-10-13, только режим плана (--once), боевой запуск — по решению пользователя.
# Валюта аккаунта — PLN: все суммы ниже в злотых.

customer_id: "8826134558"
monitoring_config: experagro.yaml    # Ringostat + Supabase (expertagro_leads) + Telegram (его kpi 150 устарел, цель — из таблицы)
form_action: form_submit_web         # конверсия «форма» в Google Ads аккаунта TIG / ЭкспертАгро
ad_call_actions: ["Calls from ads"]   # звонки по номеру из объявлений: только из Google Ads, по кампании (в Ringostat кампании у них нет)

loop_min: 2
heartbeat_min: 120
grace: 2.0               # допустимый расход = (2 + заявки) × цель; при 0 заявок = 2 × 110 = 220 zł
abs_mult: 3.0            # жёсткий предел: расход ≥ 3 × дневной бюджет → пауза
pace_share: 0.4          # «темп»: +40% бюджета за 30 минут без новых заявок → пауза (12.10: 600 zł за полчаса при бюджете 300)
pace_min: 30

allow_reenable: false    # пока выключено: возобновление включаем отдельным решением
allow_budget: false      # управление бюджетом не включено (нет budget_control у кампаний)
telegram: true           # в режиме плана сообщения не уходят, пока --telegram не указан явно

campaigns:
  # Цель заявки — из таблицы «Цели2 Адвайта», лист «Октябрь 26» (прочитано 2026-10-13): CPA 110 zł у обеих рекламных строк
#   «Ekspertagro - Теплицы Польша» (план 59 заявок, бюджет 6500 zł) → general_pmax;
#   «Ekspertagro - Мерчант» (план 39 заявок, бюджет 4300 zł) → shop_search, shop_pmax.
  - {id: 23593683252, name: general_pmax, target: 110}   # бюджет 293 zł, MAXIMIZE_CONVERSIONS
  - {id: 24210390946, name: shop_search,  target: 110}   # бюджет 300 zł, SHOPPING, TARGET_SPEND
  - {id: 24230255260, name: shop_pmax,    target: 110}   # бюджет 250 zł, MAXIMIZE_CONVERSIONS
  - {id: 24353873699, name: general_search_rozmiary, target: 110}   # general / search / rozmiary / katalog, бюджет 150 zł (потолок), Maximize clicks; включена 14.10 (Э-003..Э-005); «Теплицы Польша», цель 110 из таблицы

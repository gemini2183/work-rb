# Универсальный сторож расхода и цены заявки: Скрипты/gads_spend_guard_cpa.py --client EkspertAgro
# Файл описывает ЧТО охранять. Боевой режим (--execute) задаётся только флагом запуска, не здесь.
# СТАТУС: черновик 2026-10-13, только режим плана (--once), боевой запуск — по решению пользователя.
# Валюта аккаунта — PLN: все суммы ниже в злотых.

customer_id: "8826134558"
monitoring_config: experagro.yaml    # Ringostat + Supabase (expertagro_leads) + Telegram (его kpi 150 устарел, цель — из таблицы)
form_action: form_submit_web         # конверсия «форма» в Google Ads аккаунта TIG / ЭкспертАгро
ad_call_actions: ["Calls from ads"]   # звонки по номеру из объявлений: только из Google Ads, по кампании (в Ringostat кампании у них нет)

# Незнакомая ВКЛЮЧЁННАЯ кампания (нет в списке ниже и не в исключениях): сторож пишет в Telegram и сразу берёт её под минимальную
# защиту — пауза при расходе ≥ меньшего из «1 × бюджет» и «2 × default_target» при нуле заявок за день, дальше обычное правило
# цены заявки. Решение пользователя 2026-11-04. Осознанный тест: впиши в `campaigns` или добавь id в `unmanaged_ok`.
default_target: plan      # цена заявки по плану месяца («Цели2», строка default_plan_row)
default_plan_row: "Ekspertagro - Теплицы Польша"
unmanaged_ok: []
loop_min: 2
heartbeat_min: 120
grace: 2.0               # допустимый расход = (2 + заявки) × цель; при 0 заявок = 2 × 110 = 220 zł
dry_mult: 3.0           # «расход без заявок подряд»: пауза, когда расход с последней заявки (копится через дни) ≥ 3 × цели; ложная пауза у кампании на цели exp(−3) ≈ 5%; утром сам не включает (Инфраструктура.md 2026-11-04)
abs_mult: 2.0            # аварийный предел: расход ≥ 2 × МАКСИМАЛЬНЫЙ бюджет дня → пауза (было 3.0, решение 2026-11-04)
pace_share: 0.4          # «темп»: +40% бюджета за 30 минут и заявок за день 0 → пауза (с 04.11; раньше «без новых заявок в окне»; 12.10: 600 zł за полчаса при бюджете 300)
pace_min: 30
pace_min_allow_share: 0     # условие «расход дня ≥ 25% допустимого» снято 2026-11-04: «темп» теперь только при нуле заявок за день, ложная пауза 23.10 (n=1) больше невозможна; на кампаниях с бюджетом 50 zł «темп» снова работает (по логам: 5 срабатываний из 5 на днях без заявок)
currency: zł             # подпись валюты в сообщениях сторожа (иначе берётся из аккаунта)

allow_reenable: true     # решение пользователя 2026-11-04: как у ProfiMet — включать обратно, если заявки догнали (нужен и --execute)
morning_resume: true     # решение пользователя 2026-11-04: утром следующего дня включать кампании, которые сторож поставил на паузу по цене заявки / «темпу»; после второй такой паузы за 3 дня — не включает (≈1.8% у здоровой кампании), нужен разбор
morning_resume_at: "07:30"   # не раньше этого времени (часы компьютера)
allow_budget: false      # управление бюджетом не включено (нет budget_control у кампаний)
telegram: true           # в режиме плана сообщения не уходят, пока --telegram не указан явно

# Подсказки «недобор расхода» (guard_hints.py, решение пользователя 2026-11-05). enabled: false — пока не включено после пробного прогона
# (`python gads_spend_guard_cpa.py --client <Имя> --once --hints` в режиме плана, Telegram не шлёт). Сторож ничего не пишет в кабинет:
# сообщение + строка в Статистика/guard_signals.csv, действие только после «да». Пороги — рабочие оценки, пересмотреть по данным.
underspend:
  enabled: false
  share: 0.5            # недобор: медиана расхода чистых дней < 50% бюджета
  clean_days: 3         # сколько чистых дней нужно (по логике window_check.py)
  gate: 0.8             # порог P(цена заявки <= цели) по обеим моделям; режим риска проекта не подвязан (политика: 90/80/70 по режиму)
  k0: 3                 # вес приора проекта, «заявок»
  step_pct: 15          # шаг рычага (tCPA / потолок клика / ставки групп)
  effect_days: 3        # через сколько чистых дней после применения считать эффект
  remind_days: 3        # напоминание, если нет ответа
  no_days: 7            # после ответа «нет» новых предложений по кампании нет

campaigns:
  # Цель заявки (правило пользователя 2026-11-04): `target: auto` = tCPA самой кампании из кабинета, если он выставлен; иначе цель из плана
# «Цели2 Адвайта» (строка в `plan_row`, обновляется само раз в сутки). Число вместо `auto` — осознанное исключение с записанной причиной. Раньше было 110 zł (лист «Октябрь 26», прочитано 2026-10-13)
#   «Ekspertagro - Теплицы Польша» (план 59 заявок, бюджет 6500 zł) → general_pmax;
#   «Ekspertagro - Мерчант» (план 39 заявок, бюджет 4300 zł) → shop_search, shop_pmax.
  - {id: 23593683252, name: general_pmax, target: auto, plan_row: "Ekspertagro - Теплицы Польша"}   # бюджет 293 zł, MAXIMIZE_CONVERSIONS
  - {id: 24210390946, name: shop_search,  target: auto, plan_row: "Ekspertagro - Мерчант"}   # бюджет 300 zł, SHOPPING, TARGET_SPEND
  - {id: 24230255260, name: shop_pmax,    target: auto, plan_row: "Ekspertagro - Мерчант"}   # бюджет 50 zł (с 16.10; было 250), MAXIMIZE_CONVERSIONS
  - {id: 24353873699, name: general_search_rozmiary, target: auto, plan_row: "Ekspertagro - Теплицы Польша"}   # general / search / rozmiary / katalog, бюджет 150 zł (потолок), Maximize clicks; включена 14.10 (Э-003..Э-005); «Теплицы Польша», цель 110 из таблицы
  - {id: 24360520273, name: general_pmax_rozmiary, target: auto, plan_row: "Ekspertagro - Теплицы Польша"}   # новая PMax, бюджет 50 zł (потолок с 15.10; было 110), создана 14.10, включена 15.10 (Э-007, Э-008); цель 110 из таблицы «Цели2 Адвайта»
  - {id: 24397252446, name: shop_tail, target: 87, total_limit: 600, since: 2026-10-27}   # тест Э-015 (Shopping, хвост запросов), создана 27.10 на паузе; бюджет 70 zł; личный hard_mult снят 2026-11-04 (решение пользователя: «везде сняты»), действует общий предел 2× бюджета дня + правило «расход без заявок подряд» 3× цели (261 zł); общий потолок теста 600 zł с даты включения (поправить since при включении); цель 87 zł = 20 €; сторож нужно перезапустить после включения кампании

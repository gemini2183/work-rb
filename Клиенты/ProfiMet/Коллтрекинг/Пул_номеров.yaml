# Числа, похожие на номер, которые законно не подменяются (найдено 2026-10-20 проверкой всех страниц сайта):
# реквизиты компании на /ofirmie и /polityka-prywatnosci и контакт по вопросам данных в политике конфиденциальности.
ignore_numbers:
  - "5272935629"   # NIP
  - "0000858603"   # KRS
  - "386967527"    # REGON
  - "500048825"    # «zadzwonić pod numer 5000 48 825» в политике конфиденциальности (RODO-контакт, не коммерческая линия; вне Ringostat)
# default не задан — на сайте нет отдельного канала "без UTM" в списке
# каналов трафика Ringostat (см. Решения.md, запись 2026-09-21), номер вне
# зоны действия каналов не проверяем этим прогоном.

# Реестр фактов ProfiMet для скрипта Скрипты/ads_facts_audit.py (контролёр актуальности текстов).
# Три слоя: что читаем с сайта (site_extract) → что подтверждено и ожидаем (expected) → какие утверждения ищем в рекламе (claims, banned).
# Обновлять при смене акции/цифр на сайте; дата и источник — в поле verified. Источники: Креативы/Факты_сайта_*.md, скриншоты пользователя.
client: ProfiMet
customer_id: "7552781705"

site_urls:
  - https://mocnaszklarnia.pl/

# Как достать значение со страницы сайта (regex по тексту страницы; pick: mode — самое частое, first — первое)
site_extract:
  gifts_count:      {regex: '(\d+)\s+prezent', pick: mode}
  promo_end:        {regex: 'Promocja trwa tylko do\s+(\d{1,2}\s+[a-ząćęłńóśźż]+)', pick: first}
  orders_year:      {regex: 'zamówienia rocznie\s*(\d{1,3}(?:\s\d{3})+\+?)', pick: first}
  experience_years: {regex: 'doświadczenia produkcyjnego\s*(\d+)\s*lat', pick: first}
  warranty_frame:   {regex: '(\d+)\s+lata gwarancji\s+na ramę', pick: first}
  warranty_poly:    {regex: '(\d+)-letnia gwarancja\s+na poliwęglan', pick: first}
  free_delivery_from: {regex: 'Darmowa dostawa od\s+(\d+)\s*zł', pick: first}
  delivery_days:    {regex: 'Czas trwania\s+(\d+-\d+)\s+dni', pick: first}
  rating:           {regex: 'średnia ocena klienta\s*([\d.,]+)', pick: first}
  reviews:          {regex: 'Ponad\s+(\d+)\s+recenzji', pick: first}
  multi_discount:   {regex: 'rabat o wysokości\s+(\d+)\s*z[łl]', pick: first}
  countries:        {regex: 'geografia sprzedaży szklarni\s*(\d+)\s+krajów', pick: first}

# Подтверждённые значения (сравниваются с сайтом; расхождение = «сайт изменился, обновить рекламу»)
expected:
  gifts_count: "4"
  promo_end: "31 października"
  orders_year: "45 000+"
  experience_years: "16"
  warranty_frame: "2"
  warranty_poly: "5"
  free_delivery_from: "1200"
  delivery_days: "3-7"
  rating: "4.9"
  reviews: "80"
  multi_discount: "100"
  countries: "11"
verified: "2026-10-13: отрисованная страница mocnaszklarnia.pl (Playwright/Chrome) + скриншоты пользователя (значок ECJiP «Wyprodukowano w Polsce»)"

# Утверждения в рекламных текстах, которые надо сверять с фактом (группа 1 regex — значение)
claims:
  - {id: gifts,      fact: gifts_count,      label: "число подарков",          pattern: '(\d+)\s+(?:prezent|podar)'}
  - {id: promo_end,  fact: promo_end,        label: "дата окончания акции",     pattern: 'do\s+(\d{1,2}\s+(?:stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia))'}
  - {id: orders,     fact: orders_year,      label: "заказов в год",            pattern: '(\d{1,3}(?:[\s ]\d{3})+\+?)\s*zam[óo]wie'}
  - {id: warranty_poly, fact: warranty_poly, label: "гарантия на поликарбонат, лет", pattern: '(\d+)\s*lat\s+gwarancji\s+na\s+poliw|gwarancja\s+(?:do\s+)?(\d+)\s+lat'}
  - {id: experience, fact: experience_years, label: "лет опыта/производства",   pattern: '(\d+)\s*[Ll]at\s+(?:doświadczeni|produkcji|produkujemy|na rynku)|od\s+(\d+)\s+lat'}

# Запрещённые/недоказанные формулировки (любой текст в рекламе)
banned:
  - {pattern: 'najniższ|najlepsz|najtańsz|najdłuż|najsilniejsz|numer 1|nr 1', reason: "превосходная степень без источника"}
  - {pattern: 'instalacj', reason: "услуга установки не подтверждена на сайте"}
  - {pattern: '100[\s ]?000', reason: "на сайте 45 000+ заказов в год"}
  - {pattern: 'ponad 10 lat|10\+?\s*lat', reason: "срока службы «10+ лет» на сайте нет (гарантия 2/5 лет)"}
  - {pattern: '\b(?:2024|2025)\b', reason: "устаревший год"}
  - {pattern: 'od 2008', reason: "на сайте 16 лет опыта, «с 2008» не подтверждено"}
  - {pattern: '\bHIT\b|\bNowo[śs][ćc]\b', reason: "недоказанный ярлык"}
  - {pattern: '2[.,]4\s?m\b', reason: "высоты «до 2.4 м» на сайте нет"}
  - {pattern: 'Eksport do|\bUE\b', reason: "на сайте «11 krajów», слов «UE» нет"}
  - {pattern: 'certyfikowan', reason: "только с подтверждённым значком ECJiP «Wyprodukowano w Polsce»; проверять формулировку", warn: true}

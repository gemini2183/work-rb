checkpoint: |
  ## Чекпоинт 2026-11-18 | ProfiMet YouTube, анализ и перенастройка yt_cold | контекст ~165 тыс. (оценка по числу ходов, счётчик не запускал), ходов ~30
  Цель: понять, почему yt_cold сжигает дневной бюджет за 30-40 минут без заявок, и перенастроить кампанию.
  Сделано (факт, с путями):
  - Факты: Клиенты/ProfiMet/Работы/2026-11-18_yt_cold/10_факты.md; заявки из Ringostat, Supabase, call_view (0 у yt_cold): 12_заявки.md; разрезы: 20_анализ.md; план: 30_план.md.
  - Кабинет: стратегия yt_cold (id 24468615055, customer 7552781705) MAXIMIZE_CONVERSIONS -> TARGET_CPA 33 EUR, 18.11 10:25, прочитано обратно (PAUSED, TARGET_CPA, 33.0); бюджет 30 EUR; кампания PAUSED. Снимок «до»: Клиенты/ProfiMet_YouTube/Статистика/snapshot_before_bidding_24468615055_20261118_1025.json. Запись: 40_запись.md.
  - Сторож: Клиенты/ProfiMet/guard_config.yaml строка 86 target 17 -> 33; счёт «без заявок» (carry в gads_spend_guard_state.json) сброшен вручную 32,65 -> 0; сторож перезапущен 10:27. Копии «до» в папке задачи.
  - Скрипты: Скрипты/gads_campaign_breakdown.py (общие разрезы кампании), gads_set_campaign_bidding.py --target-cpa (поле campaign.target_cpa; maximize_conversions.target_cpa_micros Demand Gen отклоняет, П-038).
  - Вики: Решения.md, Эксперименты.md (итог Ю-Э-02), Хроника_2026-11.md, Доска_yt_cold.md, Паспорт.md, Задачи.md в Клиенты/ProfiMet_YouTube/; Журнал_изменений.md (Ю-013 стратегия, Ю-014 сторож) и закрытие 2 задач внесены wiki-recorder, отчёт получен. Расхождение: задача «Проверить эффект Ю-Э-02» (дата 19.11) стоит с окном «с момента смены стратегии», а кампания на паузе - окно пойдёт с включения; нужно решение пользователя или правка даты.
  - Правила: CLAUDE.md - новый раздел «чек-лист перед планом и брифом агенту» (анализ кампании только по База_знаний/Агенты/Алгоритм_анализа_кампании.md); Агенты/index.md - строка «Аналитик кампании» ведёт на алгоритм.
  Решено пользователем (18.11): порог цены заявки yt_cold 30-35 EUR; стратегия с целью CPA (потом «да, добро, всё сам делай» к таблице рычагов); трекинг считает проверенным; оценка по объёму (около 100 EUR без заявки), не по числу дней; отдельная кампания по сегменту «искали запросы» - «да, позже».
  Моё предложение, не принятое: исключение 38 каналов не делал (скрипт на уровне аккаунта, затронул бы yt_warm, PMax, Display, выгода около 2%); нужен скрипт на уровень кампании.
  Открыто / следующий шаг: 1) Решение пользователя: когда включать yt_cold (вручную; сторож после включения обнулит счёт ещё раз). Потом по порядку: 2) комментарий в guard_config.yaml строки 83-85 ещё про target 17 - обновить по «да»; 3) script-builder: визиты profimet_visits по utm_campaign=yt_cold, GA4/Метрика по формам и клику по номеру; 4) campaign_slices.py - флаг --allow-yt и цели 30-35 EUR, решить, что оставить: gads_campaign_breakdown.py или campaign_slices.py; 5) отдельный разговор про порядок документов по анализу (Алгоритм_анализа_кампании.md, Методология-выбора-метода-и-периода-анализа-кампаний.md, Процедура_догон_плана_месяца_лог.md, Аналитик_PMax_диагностика.md, разделы CLAUDE.md) - пользователь хочет навести порядок в файлах и промптах.
  Читать при старте (≤5): d:\GitHub\work-rb\Клиенты\ProfiMet\Работы\2026-11-18_yt_cold\40_запись.md; d:\GitHub\work-rb\Клиенты\ProfiMet_YouTube\Паспорт.md; d:\GitHub\work-rb\Клиенты\ProfiMet_YouTube\Задачи.md; d:\GitHub\work-rb\База_знаний\Агенты\Алгоритм_анализа_кампании.md; d:\GitHub\work-rb\CLAUDE.md (раздел «чек-лист перед планом»).
  НЕ читать: Журнал_изменений.md и Хроники целиком, Каталог_операций.md целиком, README скриптов целиком.
  Незавершённое в кабинетах: нет (стратегия verified чтением обратно). Кампания PAUSED, включение - решение пользователя.
  Проверка состояния: из Скрипты - PYTHONUTF8=1 python state_digest.py --customer-id 7552781705 --client-folder ProfiMet_YouTube --hours 24; python gads_spend_guard_cpa.py --client ProfiMet --print-config (ожидаем yt_cold target 33).
  Допущения/что не проверено: как кампания поведёт себя на TARGET_CPA без истории конверсий; откат стратегии без --target-cpa не проверялся; документация типа Demand Gen для target_cpa не сверена; визиты и GA4 по yt_cold не читались; расход токенов агентов за сессию около 600 тыс. (агенты по 50-120 тыс.).

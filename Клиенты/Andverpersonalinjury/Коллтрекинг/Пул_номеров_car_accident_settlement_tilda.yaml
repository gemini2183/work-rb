    utm: {utm_source: ".*", utm_medium: "cpc", utm_term: ".*", utm_content: ".*", utm_campaign: ".*"}
    utm_test: {utm_source: google, utm_medium: cpc}
    pool:
      - "+18883783267"
      - "+18883448725"
      - "+18883025461"

  # Отдельный канал ChatGPT: utm_source=chatgpt.com + utm_medium=cpc -> один номер (проверено 2026-10-07 на старой странице)
  - name: "ChatGPT"
    utm: {utm_source: "chatgpt.com", utm_medium: "cpc", utm_term: ".*", utm_content: ".*", utm_campaign: ".*"}
    utm_test: {utm_source: "chatgpt.com", utm_medium: cpc}
